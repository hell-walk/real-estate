<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="map-title map-desc">
  <title id="map-title">Sketch map of south Lucknow, drawn on paper</title>
  <desc id="map-desc">A hand-drawn map on cream paper: the Gomti river curves across the top with Hazratganj and Gomti Nagar on its bank, Shaheed Path sweeps across the middle past Ekana stadium and the malls, Kanpur Road runs to the airport in the south west, Raebareli Road past SGPGI to the south, Sultanpur Road to the south east, and the Ratan Galaxy gate is marked in Sector 12 of Vrindavan Yojna, just below Shaheed Path.</desc>
  <rect width="1200" height="900" fill="#f4ecdb"/>
  <!-- faint grid of the paper -->
  <g stroke="#e4d9c2" stroke-width="1">
    <path d="M0 150h1200M0 300h1200M0 450h1200M0 600h1200M0 750h1200M150 0v900M300 0v900M450 0v900M600 0v900M750 0v900M900 0v900M1050 0v900"/>
  </g>
  <!-- the Gomti, with its bank -->
  <path d="M0 150c160 40 300 60 440 30s250-70 400-60 240 40 360-10v-90H0z" fill="#e9e1cd"/>
  <path d="M0 150c160 40 300 60 440 30s250-70 400-60 240 40 360-10" fill="none" stroke="#9db0bf" stroke-width="22" stroke-linecap="round"/>
  <path d="M0 150c160 40 300 60 440 30s250-70 400-60 240 40 360-10" fill="none" stroke="#7f98ab" stroke-width="3" stroke-dasharray="1 0" opacity="0.7"/>
  <!-- the railway, Charbagh to Utrathia and on south -->
  <path d="M400 330c-20 120 10 240 30 330s20 150 20 240" fill="none" stroke="#3b3328" stroke-width="3"/>
  <path d="M400 330c-20 120 10 240 30 330s20 150 20 240" fill="none" stroke="#f4ecdb" stroke-width="2" stroke-dasharray="10 10"/>
  <!-- Kanpur Road: the airport to Charbagh -->
  <path d="M40 790c110-130 200-280 340-450" fill="none" stroke="#3b3328" stroke-width="7" stroke-linecap="round"/>
  <!-- Raebareli Road: Charbagh south past SGPGI -->
  <path d="M400 330c-50 130-110 260-160 400s-40 110-60 170" fill="none" stroke="#3b3328" stroke-width="7" stroke-linecap="round"/>
  <!-- Sultanpur Road: off Shaheed Path to the south east -->
  <path d="M880 430c70 110 150 230 210 330s70 90 90 140" fill="none" stroke="#3b3328" stroke-width="7" stroke-linecap="round"/>
  <!-- Kisan Path, the outer ring -->
  <path d="M60 890c200-60 420-60 640-20s360 10 500-120" fill="none" stroke="#3b3328" stroke-width="5" stroke-linecap="round" stroke-dasharray="18 10"/>
  <!-- Shaheed Path: the six lane arc -->
  <path d="M80 590c160-30 300-120 520-120s360 10 580-140" fill="none" stroke="#3b3328" stroke-width="16" stroke-linecap="round"/>
  <path d="M80 590c160-30 300-120 520-120s360 10 580-140" fill="none" stroke="#f0bf3a" stroke-width="3" stroke-dasharray="14 10" stroke-linecap="round"/>
  <!-- the sector roads of Vrindavan Yojna -->
  <g fill="none" stroke="#3b3328" stroke-width="3" stroke-linecap="round">
    <path d="M560 530v240M640 520v250M720 510v260M800 520v230"/>
    <path d="M540 590h280M540 660h280M540 730h280"/>
  </g>
  <path d="M560 600h80v60h-80z" fill="#e4d9c2" stroke="#3b3328" stroke-width="2"/>
  <!-- places -->
  <g fill="#3b3328">
    <circle cx="400" cy="330" r="7"/>
    <circle cx="430" cy="690" r="5"/>
    <rect x="300" y="200" width="22" height="22" transform="rotate(10 311 211)"/>
    <rect x="690" y="340" width="24" height="24" transform="rotate(-8 702 352)"/>
    <rect x="850" y="400" width="22" height="22"/>
    <rect x="1080" y="360" width="22" height="22"/>
    <rect x="560" y="380" width="26" height="26" rx="13"/>
    <rect x="240" y="690" width="22" height="22"/>
    <rect x="930" y="230" width="22" height="22"/>
    <rect x="80" y="760" width="26" height="14"/>
  </g>
  <g fill="#3b3328" font-family="Cabinet Grotesk, Segoe UI, system-ui, sans-serif" font-size="24">
    <text x="330" y="218">Hazratganj</text>
    <text x="560" y="130">Gomti river</text>
    <text x="720" y="270">Gomti Nagar</text>
    <text x="1190" y="300" text-anchor="end">Gomti Nagar Extension</text>
    <text x="1190" y="247" text-anchor="end">Janeshwar Mishra Park</text>
    <text x="724" y="358">Ambedkar Park</text>
    <text x="596" y="398">Ekana stadium</text>
    <text x="880" y="417">Lulu Mall</text>
    <text x="1190" y="350" text-anchor="end">Phoenix Palassio</text>
    <text x="415" y="320">Charbagh station</text>
    <text x="270" y="707">SGPGI, Medanta</text>
    <text x="114" y="772">Airport</text>
    <text x="446" y="696">Utrathia station</text>
    <text x="1000" y="560" transform="rotate(57 1000 560)">Sultanpur Road</text>
    <text x="215" y="500" transform="rotate(-52 215 500)">Kanpur Road</text>
    <text x="160" y="620" transform="rotate(-10 160 620)">Shaheed Path</text>
    <text x="900" y="870" text-anchor="end">Kisan Path</text>
    <text x="228" y="805">Raebareli Road</text>
    <text x="542" y="800">Vrindavan Yojna, sector 12</text>
  </g>
  <!-- the gate -->
  <g>
    <circle cx="600" cy="630" r="30" fill="none" stroke="#3b3328" stroke-width="3"/>
    <circle cx="600" cy="630" r="15" fill="#f0bf3a" stroke="#3b3328" stroke-width="3"/>
    <path d="M600 660v60" stroke="#3b3328" stroke-width="3"/>
    <text x="540" y="565" fill="#3b3328" font-family="Cabinet Grotesk, Segoe UI, system-ui, sans-serif" font-size="30" font-weight="700">Ratan Galaxy</text>
  </g>
  <!-- the title block -->
  <g font-family="Cabinet Grotesk, Segoe UI, system-ui, sans-serif">
    <text x="48" y="56" fill="#3b3328" font-size="34" font-weight="700">South Lucknow</text>
    <text x="48" y="86" fill="#7a7062" font-size="20">A sketch pinned up at the gate · not to scale · 2 to 3 km off Shaheed Path</text>
    <text x="1150" y="60" fill="#3b3328" font-size="26" text-anchor="end">N ↑</text>
  </g>
</svg>
