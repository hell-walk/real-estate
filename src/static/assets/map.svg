    <path d="M120 740c110-70 150-190 300-230s220 50 380 0 170-210 350-230 280 50 380 10"/>
    <path d="M180 660c90-60 140-160 270-200s200 40 350-10 150-190 320-210 260 40 360 0"/>
    <path d="M240 590c80-50 130-130 240-170s180 30 320-10 140-170 300-190 240 30 340-10"/>
