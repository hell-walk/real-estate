  <title id="map-title">Sketch map of the ridge road above Pune</title>
  <desc id="map-desc">A drawn map: the ridge road climbs west from Bavdhan to the Verdant Ridge gate, with Baner and Hinjawadi to the north, Kothrud and the city to the east, and the Mulshi road running south west.</desc>
